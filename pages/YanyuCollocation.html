<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言语规范搭配背诵手册 · 305 词</title>
<meta name="description" content="305 条公文规范搭配，支持卡片翻面、例句挖空、释义反推与速查表格四种背诵模式，含掌握度进度追踪。">
<meta name="keywords" content="行测,言语理解,逻辑填空,规范搭配,背诵,国考">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root{
  --ink:#1a2332; --ink-soft:#3a4a5e; --ink-mute:#6b7a8f;
  --paper:#faf8f5; --paper-warm:#f3efe8; --card:#fffdfa;
  --line:#d9d2c7; --line-soft:#e8e2d8;
  --primary:#1a365d; --primary-deep:#0f2440; --accent:#c2410c; --accent-soft:#fde8d8;
  --good:#15803d; --good-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --info:#1d4ed8; --info-soft:#dbeafe;
  --shadow:0 1px 3px rgba(26,35,50,.08),0 4px 12px rgba(26,35,50,.06);
  --shadow-lg:0 4px 16px rgba(26,35,50,.1),0 12px 32px rgba(26,35,50,.08);
  --radius:12px;
  /* hero 渐变与主按钮底色独立于 --primary：暗色下 --primary 是浅蓝，
     直接拿来当底色配白字会几乎没有对比度 */
  --hero-a:#1a365d; --hero-b:#0f2440;
  --active-bg:#1a365d; --active-fg:#ffffff;
}
[data-theme="dark"]{
  --ink:#e8eaed; --ink-soft:#c2c8d2; --ink-mute:#8b94a4;
  --paper:#12151b; --paper-warm:#1a1e26; --card:#181c24;
  --line:#2c323d; --line-soft:#232833;
  --primary:#8ab4f8; --primary-deep:#aecbfa; --accent:#f97316; --accent-soft:#3a2415;
  --good:#4ade80; --good-soft:#12301f; --warn:#fbbf24; --warn-soft:#33260c;
  --bad:#f87171; --bad-soft:#3a1c1c; --info:#93c5fd; --info-soft:#16243d;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 4px 16px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4);
  --hero-a:#182642; --hero-b:#0b1322;
  --active-bg:#2563eb; --active-fg:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.7; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; gap:14px;
  padding:10px 20px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar a{font-size:13px;color:var(--ink-soft);text-decoration:none;font-weight:500}
.topbar a:hover{color:var(--accent)}
.brand-sub{font-size:12.5px;color:var(--ink-mute);letter-spacing:.3px}
.theme-toggle{
  margin-left:auto; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--card); font-size:15px;
  display:flex; align-items:center; justify-content:center; transition:.2s;
}
.theme-toggle:hover{border-color:var(--accent);transform:rotate(-15deg)}

.wrap{max-width:1000px;margin:0 auto;padding:0 20px;width:100%}

/* ---------- Hero ---------- */
.hero{
  background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);
  color:#fff; padding:38px 0 30px;
}
.hero .tag{
  display:inline-block;font-size:11.5px;letter-spacing:2px;opacity:.8;
  border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 12px;margin-bottom:14px;
}
.hero h1{font-size:1.9rem;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.hero p{font-size:.92rem;opacity:.82;margin-bottom:22px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.hero-stats>div{background:rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.14)}
.hero-stats .n{font-size:1.5rem;font-weight:700;line-height:1.2}
.hero-stats .n.good{color:#86efac}
.hero-stats .n.warn{color:#fcd34d}
.hero-stats .l{font-size:11.5px;opacity:.75;margin-top:2px}
.progress-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#fbbf24,#4ade80);transition:width .45s ease}

/* ---------- 工具栏 ---------- */
.toolbar{
  position:sticky; top:55px; z-index:50;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); padding:10px 0 0;
}
.toolbar-inner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.toolbar input[type=search]{
  flex:1 1 220px;min-width:0;padding:8px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);font-size:13.5px;outline:none;
}
.toolbar input[type=search]:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--info-soft)}
.toolbar select,.toolbar .ghost-btn{
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);font-size:13px;color:var(--ink-soft);outline:none;
}
.toolbar .ghost-btn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.tab{
  flex:0 0 auto;padding:7px 16px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink-soft);font-size:13.5px;font-weight:500;transition:.18s;
}
.tab:hover{border-color:var(--primary);color:var(--primary)}
.tab.active{background:var(--active-bg);border-color:var(--active-bg);color:var(--active-fg)}

/* ---------- 舞台 ---------- */
main{padding:26px 0 60px;min-height:60vh}
.stage-meta{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12.5px;color:var(--ink-mute);margin-bottom:14px;
}
.stage-meta .pos{font-weight:600;color:var(--ink-soft)}

/* ---------- M1 卡片 ---------- */
.flip-scene{perspective:1600px}
.flip-card{
  position:relative;transform-style:preserve-3d;display:grid;
  transition:transform .55s cubic-bezier(.2,.7,.3,1);
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);min-height:300px;
}
.flip-scene.flipped .flip-card{transform:rotateY(180deg)}
.flip-face{
  grid-area:1/1;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:32px 34px;display:flex;flex-direction:column;justify-content:center;
}
.flip-face--back{transform:rotateY(180deg);background:var(--card)}
.flip-word{font-size:2rem;font-weight:700;letter-spacing:1px;color:var(--ink);margin-bottom:14px;line-height:1.4}
.flip-meaning{font-size:1.02rem;color:var(--ink-soft);background:var(--paper-warm);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0}
.flip-quote{font-size:1.08rem;line-height:1.9;color:var(--ink)}
.flip-quote::before{content:'「';color:var(--accent)}
.flip-quote::after{content:'」';color:var(--accent)}
.flip-source{margin-top:18px;font-size:13px;color:var(--ink-mute)}
.card-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* ---------- 徽章 ---------- */
.badge{
  display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper-warm);color:var(--ink-soft);font-weight:500;
}
.badge.theme{border-color:var(--info);background:var(--info-soft);color:var(--info)}
.badge.shape-A{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.badge.shape-B{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.badge.shape-C{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.badge.st-0{border-color:var(--line);background:var(--paper-warm);color:var(--ink-mute)}
.badge.st-1{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.badge.st-2{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}

/* ---------- 操作条 ---------- */
.actions{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin-top:18px;padding-top:16px;border-top:1px dashed var(--line-soft);
}
.btn{
  padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink-soft);font-size:13.5px;font-weight:500;transition:.18s;
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--active-bg);border-color:var(--active-bg);color:var(--active-fg)}
.btn.primary:hover{opacity:.88;color:var(--active-fg)}
.btn.good{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions .spacer{flex:1}
.hint{font-size:12px;color:var(--ink-mute);margin-top:10px}

/* ---------- M2 / M3 答题 ---------- */
.quiz{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px}
.quiz-prompt{font-size:12.5px;color:var(--ink-mute);margin-bottom:12px}
.quiz-sentence{font-size:1.25rem;line-height:2.1;color:var(--ink);margin-bottom:20px}
.quiz-sentence em{font-style:normal;color:var(--ink-mute)}
.blank-input{
  display:inline-block;min-width:8em;width:auto;
  border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);
  border-radius:4px 4px 0 0;padding:2px 10px;font-size:1.2rem;font-weight:600;color:var(--ink);
  text-align:center;outline:none;
}
.blank-input:focus{border-bottom-color:var(--primary);box-shadow:0 2px 0 var(--primary)}
.answer-input{
  width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);font-size:1rem;outline:none;
}
.answer-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--info-soft)}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:14px;line-height:1.8}
.feedback.ok{background:var(--good-soft);border-left:4px solid var(--good);color:var(--good)}
.feedback.no{background:var(--bad-soft);border-left:4px solid var(--bad);color:var(--bad)}
.feedback.close{background:var(--warn-soft);border-left:4px solid var(--warn);color:var(--warn)}
.feedback b{font-weight:700}
.clue{
  margin-top:16px;padding:12px 16px;border-radius:10px;
  background:var(--paper-warm);border:1px dashed var(--line);font-size:13.5px;color:var(--ink-soft);
}
.clue .k{color:var(--ink-mute);font-size:12px;display:block;margin-bottom:2px}

/* ---------- M4 表格 ---------- */
.group{margin-bottom:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.group-head{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:14px 20px;background:var(--paper-warm);border:none;text-align:left;font-size:15px;font-weight:600;
}
.group-head .cnt{font-size:12px;color:var(--ink-mute);font-weight:400}
.group-head .arrow{margin-left:auto;color:var(--ink-mute);transition:transform .2s;font-size:12px}
.group.open .group-head .arrow{transform:rotate(180deg)}
.group-body{display:none;border-top:1px solid var(--line)}
.group.open .group-body{display:block}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th{
  background:var(--paper-warm);color:var(--ink-soft);text-align:left;
  padding:10px 14px;font-size:12px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.list td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.list tbody tr{cursor:pointer;transition:background .15s}
table.list tbody tr:hover{background:var(--paper-warm)}
table.list tbody tr:last-child td{border-bottom:none}
table.list .c-idx{color:var(--ink-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
table.list .c-word{font-weight:600;color:var(--ink);white-space:nowrap}
table.list .c-src{color:var(--ink-mute);font-size:12.5px;white-space:nowrap}
table.list mark{background:var(--warn-soft);color:var(--warn);padding:0 2px;border-radius:2px}

.empty{
  text-align:center;padding:60px 20px;color:var(--ink-mute);font-size:14px;
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
}

/* ---------- 页脚 ---------- */
footer{
  text-align:center;padding:26px 20px;color:var(--ink-mute);font-size:12.5px;
  border-top:1px solid var(--line);background:var(--paper-warm);
}
footer a{color:var(--ink-soft)}

@media (max-width:720px){
  .hero{padding:28px 0 24px}
  .hero h1{font-size:1.45rem}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .toolbar{top:52px}
  .flip-face{padding:24px 22px}
  .flip-word{font-size:1.5rem}
  .quiz{padding:20px 18px}
  .quiz-sentence{font-size:1.08rem}
  .toolbar-inner{gap:6px}
  .toolbar select,.toolbar .ghost-btn{padding:7px 8px;font-size:12.5px}
  /* 表格转卡片 */
  table.list thead{display:none}
  table.list,table.list tbody,table.list tr,table.list td{display:block;width:100%}
  table.list tr{border-bottom:1px solid var(--line);padding:10px 14px}
  table.list td{border:none;padding:2px 0}
  table.list td::before{
    content:attr(data-label);display:inline-block;min-width:62px;
    font-size:11.5px;color:var(--ink-mute);font-weight:600;
  }
  table.list .c-idx::before{content:'序号 '}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="310332c6-bb2a-4410-90c1-0d681395f9b2"></script>
</head>
<body>

<header class="topbar">
  <a href="../index.html#notes">← 返回学习笔记</a>
  <span class="brand-sub">言语理解 · 规范搭配 305 词</span>
  <button id="theme-toggle" class="theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>

<section class="hero">
  <div class="wrap">
    <span class="tag">行测言语理解 · 逻辑填空</span>
    <h1>言语规范搭配背诵手册</h1>
    <p>305 条公文规范搭配 · 四种背诵模式 · 掌握度进度追踪</p>
    <div class="hero-stats">
      <div><div class="n" id="stat-total">305</div><div class="l">搭配总数</div></div>
      <div><div class="n good" id="stat-known">0</div><div class="l">已掌握</div></div>
      <div><div class="n warn" id="stat-review">0</div><div class="l">待复习</div></div>
      <div><div class="n" id="stat-rate">0%</div><div class="l">掌握率</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>
</section>

<div class="toolbar">
  <div class="wrap toolbar-inner">
    <input type="search" id="search" placeholder="搜索用词 / 释义 / 例句（按 / 聚焦）" autocomplete="off">
    <select id="filter-theme" aria-label="主题筛选"></select>
    <select id="filter-status" aria-label="状态筛选">
      <option value="all">全部状态</option>
      <option value="0">未学</option>
      <option value="2">待复习</option>
      <option value="1">已掌握</option>
    </select>
    <select id="order" aria-label="刷题顺序">
      <option value="seq">顺序</option>
      <option value="shuffle">乱序</option>
      <option value="unlearned">只刷未掌握</option>
    </select>
    <button class="ghost-btn" id="reset-progress" title="清空全部掌握度标记">重置进度</button>
  </div>
  <div class="wrap">
    <div class="tabs" id="mode-tabs">
      <button class="tab active" data-mode="card">卡片翻面</button>
      <button class="tab" data-mode="blank">例句挖空</button>
      <button class="tab" data-mode="recall">释义反推</button>
      <button class="tab" data-mode="table">速查表格</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap" id="stage"></div>
</main>

<footer>
  言语规范搭配背诵手册 · 数据源自《言语规范搭配汇总》305 条 · 进度保存在本机浏览器<br>
  <a href="../index.html#notes">返回学习笔记</a>
</footer>

<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('yanyu-data').textContent);
  var esc = function (v) { return AppUtils.escapeHTML(v); };

  var STORE = AppUtils.createNamespacedStorage('yanyu_collocation_progress', { version: 1 });
  var THEME_STORE = AppUtils.createNamespacedStorage('yanyu_collocation_theme');

  var THEME_ORDER = ['规划纲要', '乡村振兴', '城市更新', '新质生产力', '教育强国', '健康中国', '文化自信', '长期护理'];
  var SHAPE_LABEL = { A: '动宾搭配', B: '名词短语', C: '并列组合' };

  var state = {
    states: {},
    mode: 'card',
    idx: 0,
    order: 'seq',
    themeFilter: '',
    statusFilter: 'all',
    query: '',
    flipped: false,
    revealed: false,
    judged: null
  };
  var shuffled = null;

  // ---------------- 持久化 ----------------
  function loadState() {
    var saved = STORE.get(null);
    if (saved && typeof saved === 'object') {
      state.states = saved.states && typeof saved.states === 'object' ? saved.states : {};
      if (saved.mode) state.mode = saved.mode;
      if (typeof saved.idx === 'number') state.idx = saved.idx;
      if (saved.order) state.order = saved.order;
      if (typeof saved.themeFilter === 'string') state.themeFilter = saved.themeFilter;
      if (typeof saved.statusFilter === 'string') state.statusFilter = saved.statusFilter;
    }
  }
  function saveState() {
    STORE.set({
      states: state.states,
      mode: state.mode,
      idx: state.idx,
      order: state.order,
      themeFilter: state.themeFilter,
      statusFilter: state.statusFilter
    });
  }
  function statusOf(n) { return state.states[n] || 0; }
  function setStatus(n, v) {
    if (statusOf(n) === v) { delete state.states[n]; } else { state.states[n] = v; }
    saveState();
  }

  // ---------------- 筛选 ----------------
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function filtered() {
    var q = state.query.trim();
    var out = [];
    for (var i = 0; i < DATA.length; i++) {
      var r = DATA[i];
      if (state.themeFilter && r.th.indexOf(state.themeFilter) < 0) continue;
      if (state.statusFilter !== 'all' && statusOf(r.n) !== Number(state.statusFilter)) continue;
      if (state.order === 'unlearned' && statusOf(r.n) === 1) continue;
      if (q) {
        var hay = r.w + ' ' + r.m + ' ' + r.e + ' ' + r.s + ' ' + r.kw.join(' ');
        if (hay.indexOf(q) < 0) continue;
      }
      out.push(r);
    }
    if (state.order === 'shuffle') {
      if (!shuffled) shuffled = shuffle(DATA);
      var keep = {};
      out.forEach(function (r) { keep[r.n] = true; });
      out = shuffled.filter(function (r) { return keep[r.n]; });
    }
    return out;
  }

  // ---------------- 判分 ----------------
  function normalize(s) {
    return String(s == null ? '' : s)
      .replace(/[（(][^）)]*[）)]/g, '')
      .replace(/[\s　]+/g, '')
      .replace(/[，,。、；;：:！!？?"'“”‘’《》·]/g, '')
      .replace(/＋/g, '+')
      .toLowerCase();
  }
  function judge(input, r) {
    var got = normalize(input);
    if (!got) return { ok: false, empty: true };
    var need = r.kw.map(normalize);
    var hit = need.filter(function (k) { return got.indexOf(k) >= 0; });
    if (hit.length === need.length) return { ok: true, exact: true };
    if (hit.length > 0) return { ok: false, partial: true, hit: hit, need: need };
    var first = need[0] || '';
    if (first.length >= 2 && got.slice(0, 2) === first.slice(0, 2)) return { ok: false, close: true };
    return { ok: false };
  }

  // ---------------- 渲染：统计 ----------------
  function updateStats() {
    var known = 0, review = 0;
    DATA.forEach(function (r) {
      var s = statusOf(r.n);
      if (s === 1) known++;
      else if (s === 2) review++;
    });
    document.getElementById('stat-total').textContent = DATA.length;
    document.getElementById('stat-known').textContent = known;
    document.getElementById('stat-review').textContent = review;
    document.getElementById('stat-rate').textContent = (DATA.length ? Math.round(known / DATA.length * 100) : 0) + '%';
    document.getElementById('progress-fill').style.width = (DATA.length ? known / DATA.length * 100 : 0) + '%';
  }

  function statusBadge(n) {
    var s = statusOf(n);
    var label = s === 1 ? '已掌握' : (s === 2 ? '待复习' : '未学');
    return '<span class="badge st-' + s + '">' + label + '</span>';
  }
  function themeBadges(r) {
