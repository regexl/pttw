<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公考高频成语 915 词 · 背诵手册</title>
<meta name="description" content="公考高频成语 915 条，按考频排序，支持速查表、背诵卡与释义测验三种模式，含掌握度进度追踪。">
<meta name="keywords" content="行测,言语理解,逻辑填空,成语,高频成语,背诵,公考">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root{
  --ink:#1a2332; --ink-soft:#3a4a5e; --ink-mute:#6b7a8f;
  --paper:#faf8f5; --paper-warm:#f3efe8; --card:#fffdfa;
  --line:#d9d2c7; --line-soft:#e8e2d8;
  --primary:#1a365d; --primary-deep:#0f2440; --accent:#c2410c; --accent-soft:#fde8d8;
  --good:#15803d; --good-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --info:#1d4ed8; --info-soft:#dbeafe;
  --shadow:0 1px 3px rgba(26,35,50,.08),0 4px 12px rgba(26,35,50,.06);
  --shadow-lg:0 4px 16px rgba(26,35,50,.1),0 12px 32px rgba(26,35,50,.08);
  --radius:12px;
  --hero-a:#1a365d; --hero-b:#0f2440;
}
[data-theme="dark"]{
  --ink:#e8eaed; --ink-soft:#c2cad4; --ink-mute:#8b94a4;
  --paper:#12151b; --paper-warm:#1a1e26; --card:#181c24;
  --line:#2b3340; --line-soft:#232833;
  --primary:#8ab4f8; --primary-deep:#aecbfa; --accent:#f97316; --accent-soft:#3a2415;
  --good:#4ade80; --good-soft:#12301f; --warn:#fbbf24; --warn-soft:#33260c;
  --bad:#f87171; --bad-soft:#3a1d1a; --info:#93c5fd; --info-soft:#16243d;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 4px 16px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4);
  --hero-a:#182642; --hero-b:#0b1322;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.75;font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
code{font-family:'SF Mono','Consolas',monospace}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px;width:100%}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:10px 20px;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.topbar a{font-size:13px;color:var(--ink-soft);text-decoration:none;font-weight:500}
.topbar a:hover{color:var(--accent)}
.topbar .brand-sub{font-size:12.5px;color:var(--ink-mute)}
.theme-toggle{
  margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);font-size:15px;display:flex;align-items:center;justify-content:center;transition:.2s;
}
.theme-toggle:hover{border-color:var(--accent);transform:rotate(-15deg)}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);color:#fff;padding:36px 0 28px}
.hero .tag{
  display:inline-block;font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.28);padding:4px 14px;border-radius:2px;margin-bottom:16px;font-weight:500;
}
.hero h1{font-size:clamp(24px,4.2vw,34px);font-weight:800;line-height:1.3;margin-bottom:10px;letter-spacing:-.01em}
.hero p{font-size:15px;color:rgba(255,255,255,.82);max-width:760px;margin-bottom:22px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.hero-stats>div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:11px 14px}
.hero-stats .n{font-size:1.5rem;font-weight:700;line-height:1.2}
.hero-stats .n.good{color:#86efac}
.hero-stats .n.warn{color:#fcd34d}
.hero-stats .l{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:2px}
.progress-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#fbbf24,#4ade80);transition:width .45s ease}

/* ---------- 工具栏 ---------- */
.toolbar{
  position:sticky;top:55px;z-index:50;
  background:color-mix(in srgb,var(--paper) 93%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 0 0;
}
.toolbar-inner{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.toolbar input[type=search]{
  flex:1 1 210px;min-width:0;padding:8px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);font-size:13.5px;outline:none;
}
.toolbar input[type=search]:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--info-soft)}
.toolbar select,.toolbar .ghost-btn{
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink-soft);font-size:13px;outline:none;transition:.18s;
}
.toolbar .ghost-btn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.tab{
  flex:0 0 auto;padding:8px 16px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink-soft);font-size:13.5px;font-weight:500;transition:.18s;
}
.tab:hover{border-color:var(--primary);color:var(--primary)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ---------- 主体 ---------- */
main{padding:24px 0 60px;min-height:56vh}
.stage-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-mute);margin-bottom:14px}
.stage-meta .pos{font-weight:600;color:var(--ink-soft)}

/* ---------- 速查表 ---------- */
.group{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.group-head{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 18px;
  background:var(--paper-warm);border:none;text-align:left;font-size:15px;font-weight:700;color:var(--primary);
}
.group-head .letter{
  width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto;
}
.group-head .cnt{font-size:12px;color:var(--ink-mute);font-weight:400}
.group-head .arrow{margin-left:auto;color:var(--ink-mute);transition:transform .2s;font-size:12px}
.group.open .group-head .arrow{transform:rotate(180deg)}
.group-body{display:none;border-top:1px solid var(--line)}
.group.open .group-body{display:block}
.idiom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px;padding:16px}
.idiom{
  background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.idiom:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line)}
.idiom .w{font-size:19px;font-weight:700;letter-spacing:2px;color:var(--ink);line-height:1.4}
.idiom .p{font-size:11.5px;color:var(--ink-mute);letter-spacing:.5px;margin:3px 0 8px;font-family:'SF Mono','Consolas',monospace}
.idiom .m{font-size:13.5px;color:var(--ink-soft);line-height:1.75}
.idiom .m.clamped{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.freq{
  display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:8px;
  vertical-align:middle;font-weight:600;letter-spacing:.3px;
}
.freq.hi{background:var(--bad-soft);color:var(--bad)}
.freq.mid{background:var(--warn-soft);color:var(--warn)}
.freq.lo{background:var(--paper-warm);color:var(--ink-mute)}
.mark{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:3px}

/* ---------- 背诵卡 ---------- */
.flash-wrap{max-width:680px;margin:0 auto}
.flash{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-lg);padding:44px 36px;text-align:center;min-height:330px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.flash .fw{font-size:clamp(30px,7vw,46px);font-weight:800;letter-spacing:5px;line-height:1.35;color:var(--ink)}
.flash .fp{font-size:13px;color:var(--ink-mute);letter-spacing:1px;font-family:'SF Mono','Consolas',monospace}
.flash .fm{font-size:17px;color:var(--ink-soft);line-height:1.95;text-align:left;max-width:540px}
.flash .hintline{font-size:12.5px;color:var(--ink-mute)}
.flash .cover{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:var(--card);border-radius:16px;
}
.flash .cover .tip{font-size:13px;color:var(--ink-mute)}
.flash-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.btn{
  padding:9px 18px;border:1px solid var(--line);border-radius:9px;background:var(--card);
  color:var(--ink-soft);font-size:13.5px;font-weight:500;transition:.18s;
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.good{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.btn.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.btn.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 测验 ---------- */
.quiz{max-width:680px;margin:0 auto}
.quiz-q{
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);
  padding:30px 32px;margin-bottom:16px;
}
.quiz-q .tag{font-size:11.5px;color:var(--ink-mute);letter-spacing:.1em;margin-bottom:10px;display:block}
.quiz-q .stem{font-size:17px;line-height:1.95;color:var(--ink)}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  transition:.18s;font-size:16px;
}
.opt:hover{border-color:var(--primary);background:var(--info-soft)}
.opt .k{
  width:24px;height:24px;border-radius:6px;background:var(--paper-warm);color:var(--ink-soft);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;
}
.opt .w{font-weight:700;letter-spacing:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.disabled{cursor:default;pointer-events:none}
.quiz-fb{margin-top:18px;padding:14px 18px;border-radius:10px;font-size:14px;line-height:1.8}
.quiz-fb.ok{background:var(--good-soft);border-left:4px solid var(--good);color:var(--good)}
.quiz-fb.no{background:var(--bad-soft);border-left:4px solid var(--bad);color:var(--bad)}
.quiz-fb b{font-weight:700}

.empty{
  text-align:center;padding:56px 20px;color:var(--ink-mute);font-size:14px;
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
}
.hint{text-align:center;font-size:12px;color:var(--ink-mute);margin-top:14px}

footer{
  text-align:center;padding:26px 20px;color:var(--ink-mute);font-size:12.5px;
  border-top:1px solid var(--line);background:var(--paper-warm);
}
footer a{color:var(--ink-soft)}

@media (max-width:640px){
  .hero{padding:26px 0 22px}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .toolbar{top:52px}
  .brand-sub{display:none}
  .idiom-grid{grid-template-columns:1fr;padding:12px}
  .flash{padding:30px 20px;min-height:280px}
  .flash .fw{letter-spacing:3px}
  .quiz-q{padding:22px 18px}
  .toolbar select,.toolbar .ghost-btn{padding:7px 8px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 zhu"],[178,"矢志不渝",13,"发誓立志不会改变，表示永远不变心。","shi zhi bu yu"],[179,"微不足道",13,"非常藐小，不值得一提。","wei bu zu dao"],[180,"革故鼎新",13,"旧指朝政变革或改朝换代。现泛指除去旧的，建立新的。","ge gu ding xin"],[181,"急功近利",13,"急于追求眼前的成效和利益。","ji gong jin li"],[182,"殚精竭虑",13,"使尽了精力，费尽了心思。","dan jing jie lv"],[183,"格格不入",13,"形容彼此不协调，不相容。多用来形容思想、感情、言论等。","ge ge bu ru"],[184,"千姿百态",12,"形容姿态多种多样，各不相同。","qian zi bai tai"],[185,"光怪陆离",12,"形容奇形怪状，五颜六色，现象奇特，也形容事物离奇多变。不能用来形容人。","guang guai lu li"],[186,"见仁见智",12,"对同一个问题，不同的人从不同的立场或角度有不同的看法。","jian ren jian zhi"],[187,"不屑一顾",12,"认为不值得一看。形容极端轻视。","bu xie yi gu"],[188,"沧海桑田",12,"后用沧海桑田比喻世事变化很大。","cang hai sang tian"],[189,"不以为然",12,"不认为是对的。表示不同意或否定。","bu yi wei ran"],[190,"今非昔比",12,"指现在不是过去能比得上的。多指形势等发生了巨大的变化，且多指好的变化。","jin fei xi bi"],[191,"任重道远",12,"担子很重，路程遥远。比喻责任重大，需要经过长期的艰苦奋斗。","ren zhong dao yuan"],[192,"同日而语",12,"把不同的人或不同的事放在一起谈论或看待。一般用作否定句或反问句。","tong ri er yu"],[193,"一目了然",12,"一眼就能看得清清楚楚。","yi mu liao ran"],[194,"前所未有",12,"历史上从来没有过。","qian suo wei you"],[195,"分道扬镳",12,"也说分道扬镜。原指分路而行。后多比喻因目标不同而各走各的路。","fen dao yang biao"],[196,"独辟蹊径",12,"比喻独创一种风格或新的方法。独辟蹈径强调过程，独树一帜强调结果。","du pi xi jing"],[197,"视而不见",12,"指不注意，不重视，睁着眼却没看见，也指不理睬，看见了当作没看见。","shi er bu jian"],[198,"一马当先",12,"作战时策马冲锋在前，形容领先或带头。","yi ma dang xian"],[199,"势如破竹",12,"形容作战或工作节节胜利，毫无阻碍。","shi ru po zhu"],[200,"融会贯通",12,"把各方面的知识和道理融化汇合，得到全面透彻的理解。","rong hui guan tong"],[201,"釜底抽薪",12,"比喻从根本上解决问题。","fu di chou xin"],[202,"一步登天",12,"比喻一下子就达到很高的境界或程度。也用来比喻人突然得志，爬上高位。","yi bu deng tian"],[203,"大张旗鼓",12,"形容进攻的声势和规模很大。也形容群众活动声势和规模很大。","da zhang qi gu"],[204,"珠联壁合",12,"比喻杰出的人才或美好的事物聚集在一起。","zhu lian bi he"],[205,"功亏一篑",12,"比喻做事情只差最后一步，没能完成.","gong kui yi kui"],[206,"功败垂成",12,"指事情接近成功的时候却遭到了失败。","gong bai chui cheng"],[207,"明哲保身",12,"明智的人善于保全自己。现指因怕连累自己而回避原则斗争的处世态度。多含贬义。","ming zhe bao shen"],[208,"耳熟能详",12,"指听得多了，能够说得很清楚、很详细。","er shu neng xiang"],[209,"醍酮灌顶",12,"比喻听了高明的意见使人受到很大启发。也形容清凉舒适。","ti tong guan ding"],[210,"唇齿相依",12,"比喻双方关系密切。相互依存。","chun chi xiang yi"],[211,"心无旁鹜",12,"旁：另外的：骛：追求。心思没有另外的追求，形容心思集中，专心致志。","xin ],[731,"兴师动众",6,"意思是指大规模出兵。现多指动用很多人力做某件事。含贬义。","xing shi dong zhong"],[732,"劳民伤财",6,"意思是既使人民劳苦，又耗费钱财；现也指滥用人力物力。含贬义。","lao min shang cai"],[733,"繁文缛节",6,"比喻过分繁琐的仪式或礼节。也比喻其他繁琐多余的事项。含贬义。","fan wen ru jie"],[734,"无可争议",6,"指对一个问题的看法、观点或做法，没有其他不同的看法、观点可以辩论。","wu ke zheng yi"],[736,"大动干戈",6,"意思是大规模地进行战争。比喻大张声势地行事。","da dong gan ge"],[737,"无可讳言",6,"意思为没有什么不可以直说的，指可以坦率地说。","wu ke hui yan"],[738,"避重就轻",6,"指回避重的责任，只拣轻的来承担，也指回避主要的问题，只谈无关重要的方面。","bi zhong jiu qing"],[739,"暗度陈仓",6,"将真实的意图隐藏在不令人生疑的行动的背后。","an du chen cang"],[741,"难以割舍",6,"不愿意舍弃或丢开。","nan yi ge she"],[742,"永生难忘",6,"意思是指一辈子也难以忘怀。","yong sheng nan wang"],[743,"撼天震地",6,"意思是指摇动了天，震撼了地。形容声势浩大，无坚不摧的力量。","han tian zhen di"],[744,"茫然不解",6,"意思是一无所知，不理解。","mang ran bu jie"],[745,"知之甚少",6,"对某方面知道的太少。","zhi zhi shen shao"],[746,"沉思翰藻",6,"寓意深刻，文辞华丽。","chen si han zao"],[747,"文采斐然",6,"意思是指文章中表现出来的典雅艳丽和令人赏心悦目的色彩和风格，说入文采好。","wen cai fei ran"],[748,"形神兼备",6,"指书法和雕塑绘画作品，不但有美妙的形态且有神韵。","xing shen jian bei"],[749,"举不胜举",6,"意思是列举也列举不完。形容数量很多。","ju bu sheng ju"],[750,"缀玉联珠",6,"比喻撰写美好的诗文。","zhui yu lian zhu"],[751,"振臂高呼",6,"举起手欢呼，形容非常高兴。","zhen bi gao hu"],[752,"不负韶华",6,"指不辜负美好的时光、美好的年华。","bu fu shao hua"],[753,"无足挂齿",6,"意思是哪里值得挂在嘴上；不值一提。","wu zu gua chi"],[754,"不负春光",6,"不辜负春天的大好时光。","bu fu chun guang"],[755,"无伤大雅",6,"意思指虽有影响但对主要方面没有妨害。","wu shang da ya"],[756,"无关紧要",6,"释义为不重要，不会影响大局。","wu guan jin yao"],[757,"水丰草茂",6,"指水流充沛，草儿茂盛。","shui feng cao mao"],[758,"广袤无垠",6,"形容广阔得望不到边际，辽阔无边。比喻非常广阔。","guang mao wu yin"],[760,"山高水长",6,"像山一样高耸，如水一般长流。原比喻人的风范或声誉像高山一样永远存在。","shan gao shui chang"],[761,"海阔天空",6,"意指像大海那样广阔，如蓝天那样空旷，形容开阔，无拘无束，比喻言谈漫无边际。","hai kuo tian kong"],[762,"天高地阔",6,"天空高远，大地辽阔，形容空间很广阔。","tian gao di kuo"],[763,"学思践悟",6,"指学习再思考，再通过实践悟出道理。","xue si jian wu"],[764,"细照笃行",6,"指将焦裕禄精神作为一面镜子从里到外、从上到下反复照一照，深入检查自己。","xi zhao du xing"],[766,"知行合一",6,"指的是思想与行动的高度统一。","zhi xing he yi"],[767,"一无所有",6,"意思是什么也没有。指钱财，也指成绩、知识。","yi wu suo you"],[768,"一无所获",6,"什么东西都没有得到。指没有收获。","yi wu suo huo"],[769,"一无所知",6,"意思是什么也不知道。指人见识少。","yi wu suo zhi"],[770,"参差不齐",6,"原意是长短、高低、大小不一致，形容很不整齐或水平不一。","cen ci bu qi"],[771,"热闹非凡",6,"意思是形容热闹的场面或景象。","re nao fei fan"],[772,"破绽百出",6,"意思是比喻说话做事漏洞非常多。含贬义。","po zhan bai chu"],[773,"百花齐放",6,"意思是形容百花盛开，丰富多彩。比喻各种不同形式和风格的艺术自由发展。","bai hua qi fang"],[774,"群雄逐鹿",6,"形容各派势力争夺最高统治地位。","qun xiong zhu lu"],[776,"遗文逸事",6,"意思是前代或前人遗留下来而少为人知的传闻，多指不见于正式记载的。","yi wen yi shi"],[777,"身临其境",6,"意思指亲身面临那种境地；也作身历其境。含褒义。","shen lin qi jing"],[778,"设身处地",6,"意思是设想自己处在别人的境地。指站在别人的处境替别人着想。","she shen chu di"],[779,"想方设法",6,"意思是想种种办法。含褒义。","xiang fang she fa"],[780,"畏首畏尾",6,"意思是前也怕，后也怕；比喻做事胆子小，顾虑多。","wei shou wei wei"],[781,"谈虎色变",6,"意思是比喻只要提到可怕的事情，紧张的连脸色都变了。","tan hu se bian"],[782,"如鱼得水",6,"意思是好像鱼得到水一样。比喻得到跟自己十分投合的人或对自己很合适的环境。","ru yu de shui"],[784,"毫不相干",6,"指跟某个事物没有丝毫联系。","hao bu xiang gan"],[785,"判若云泥",6,"意思是高低差别就像天上的云彩和地下的泥土那样悬殊。","pan ruo yun ni"],[786,"悄然兴起",6,"意思是不知不觉中，某样事物开始流行或兴盛起来。","qiao ran xing qi"],[787,"心不在焉",6,"意思是心思不在这里，指思想不集中。含贬义。","xin bu zai yan"],[788,"味同嚼蜡",6,"表面意思是像吃蜡一样，没有一点儿味。形容语言或文章枯燥无味。含贬义。","wei tong jiao la"],[789,"兴味索然",6,"意思是一点儿兴趣都没有。","xing wei suo ran"],[790,"死而复生",6,"意思是死去了又活过来，形容生命不息。","si er fu sheng"],[791,"重见天日",6,"指重新看到了天和太阳。比喻脱离黑暗，重见光明。","chong jian tian ri"],[792,"互为表里",6,"意思是甲为乙的外表，乙为甲的内里；比喻互相依存，互相接受。","hu wei biao li"],[793,"互相标榜",6,"意思是互相称颂，互相吹嘘；多用贬义。","hu xiang biao bang"],[794,"互为因果",6,"意思是原因和结果相互联系，相互转化。","hu wei yin guo"],[795,"互剥痛疮",6,"意思是比喻互揭隐私。","hu bo tong chuang"],[796,"众望所归",6,"意思是用于形容某人威望很高，受到大家敬仰和信赖。","zhong wang suo gui"],[797,"大海捞针",6,"意思是在大海里捞一根针。比喻极难找到。用于比喻句中。","da hai lao zhen"],[798,"不了了之",6,"意思是用不能了结事情的办法去了结。指把未做完的事情放在一边不管，就算完事。","bu liao liao zhi"],[799,"敷衍塞责",6,"指工作不认真负责，表面应付了事。","fu yan se ze"],[801,"石沉大海",6,"意思是把石头扔到海里会沉下去，再也找不到。比喻从此以后再也没有消息。","shi chen da hai"],[802,"无动于衷",6,"意思是心里一点儿也没有触动。指对应该关心、注意的事情毫不关心。","wu dong yu zhong"],[803,"收效甚微",6,"指付出的努力基本没什么效果。收效，成果。甚，很。微，少。","shou xiao shen wei"],[804,"粗制滥造",6,"意思是写文章或做东西马虎草率，只求数量，不顾质量。含贬义。","cu zhi lan zao"],[805,"得心应手",6,"意思是心手相应，运用自如，多形容技艺纯熟。","de xin ying shou"],[806,"绰绰有余",6,"形容房屋或钱财非常宽裕，用不完。","chuo chuo you yu"],[807,"望文生义",6,"意思是指不了解某一词句的确切涵义或来源缘由，光从字面上去牵强附会。贬义。","wang wen sheng yi"],[808,"游刃有余",6,"意思是刀刃运转于骨节空隙中，有回旋的余地；比喻技术熟练，经验丰富。","you ren you yu"],[809,"金科玉律",6,"原形容法令条文的尽善尽美。现比喻必须遵守、不能变更的信条。含褒义。","jin ke yu lv"],[810,"天经地义",6,"指天地间历久不变的常道。指理所当然，不容置疑的问题。也指理所当的事。","tian jing di yi"],[811,"日异月殊",6,"每天每月都有差异。形容变化大。","ri yi yue shu"],[812,"五颜六色",6,"形容色彩复杂或花样繁多。引申为各色各样。","wu yan liu se"],[813,"万紫千红",6,"形容百花齐放，色彩艳丽；多指繁盛的春色，也比喻事物丰富多彩。","wan zi qian hong"],[814,"姹紫嫣红",6,"形容各种花朵娇艳美丽。","cha zi yan hong"],[815,"日臻完善",6,"意思是一天天逐步达到完美的境地。","ri zhen wan shan"],[816,"高歌猛进",6,"意思是高声歌唱，勇猛前进；形容在前进的道路上，充满乐观精神。","gao ge meng jin"],[817,"烜赫一时",6,"意思是指在一个时期内名声威势很盛。贬义词。","xuan he yi shi"],[818,"电光火石",6,"意思是闪电的光，燧石的火；原为佛家语，比喻事物瞬息即逝。","dian guang huo shi"],[819,"杳无音讯",6,"意思是指没有一点消息，形容信息断绝，了解不到对方的情况。","yao wu yin xun"],[821,"无影无踪",6,"没有一点踪影。形容完全消失，不知去向。","wu ying wu zong"],[822,"动荡不安",6,"意思是动荡摇摆，不安定；形容局势不稳定，不平静。","dong dang bu an"],[823,"阴差阳错",6,"意思是比喻由于偶然的因素而造成了差错。含贬义。","yin cha yang cuo"],[824,"死气沉沉",6,"意思是形容气氛不活泼，也形容人精神消沉，不振作。含贬义。","si qi chen chen"],[825,"不期而遇",6,"意思是没有约定而遇见。指意外碰见。","bu qi er yu"],[826,"了无生机",6,"一点生命的活力都没有，奄奄一息的样子。","liao wu sheng ji"],[827,"机缘巧合",5,"特殊的缘分，巧妙的融合遇到，在一起。","ji yuan qiao he"],[828,"奄奄一息",5,"形容气息微弱临近死亡。也比喻事物即将消亡、湮没或毁灭。含贬义。","yan yan yi xi"],[830,"逢机遘会",5,"意思是遭逢机会。","feng ji gou hui"],[831,"专心致志",5,"意思是把心思全放在上面。形容一心一意，聚精会神。含褒义。","zhuan xin zhi zhi"],[832,"穷经皓首",5,"意思是直到年老头白还在钻研经书和古籍，形容勤勉好学，至老不倦。","qiong jing hao shou"],[833,"学而不厌",5,"意思是学习没有满足的时候，比喻非常好学。","xue er bu yan"],[834,"锲而不舍",5,"意思是不停地雕刻。比喻有恒心，有毅力。","qie er bu she"],[835,"奋发图强",5,"意思是振作精神，以求强盛。含褒义。","fen fa tu qiang"],[836,"一盘散沙",5,"意思是比喻力量分散，没有组织起来。","yi pan san sha"],[837,"精神振奋",5,"意思是振作精神，奋发努力，相当的精神。","jing shen zhen fen"],[838,"人心涣散",5,"意思是思想不统一。形容人心不齐。","ren xin huan san"],[839,"聚精会神",5,"形容专心致志，注意力高度集中的样子。","ju jing hui shen"],[840,"繁荣昌盛",5,"指国家兴旺发达，欣欣向荣。","fan rong chang sheng"],[841,"离心离德",5,"意思是思想不统一，信念也不一致。指不一条心。","li xin li de"],[842,"精神抖擞",5,"形容精神振奋，饱满。含褒义。","jing shen dou <script>
(function () {
  'use strict';

  var RAW = JSON.parse(document.getElementById('idiom-data').textContent);
  var DATA = RAW.map(function (r) {
    return { n: r[0], w: r[1], f: r[2], m: r[3], p: r[4], i: r[4] ? r[4].charAt(0).toUpperCase() : '#' };
  });
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  var STORE = AppUtils.createNamespacedStorage('idiom1000_progress', { version: 1 });
  var THEME_STORE = AppUtils.createNamespacedStorage('idiom1000_theme');

  var state = {
    known: {}, fuzzy: {},
    mode: 'list',
    idx: 0,
    flashUp: true,     // 背面（释义）朝上？
    quiz: null,
    openGroups: {},
    query: '',
    freq: 'all',
    status: 'all'
  };

  var stage = document.getElementById('stage');
  function esc(v) { return AppUtils.escapeHTML(v); }

  function freqClass(f) { return f >= 20 ? 'hi' : (f >= 8 ? 'mid' : 'lo'); }

  // ---------------- 持久化 ----------------
  function save() {
    STORE.set({ known: state.known, fuzzy: state.fuzzy });
  }
  function load() {
    var d = STORE.get(null);
    if (d && typeof d === 'object') {
      state.known = d.known || {};
      state.fuzzy = d.fuzzy || {};
    }
  }
  function markOf(n) {
    if (state.known[n]) return 1;
    if (state.fuzzy[n]) return 2;
    return 0;
  }
  function setMark(n, v) {
    if (v === 1) { state.known[n] = 1; delete state.fuzzy[n]; }
    else if (v === 2) { state.fuzzy[n] = 1; delete state.known[n]; }
    else { delete state.known[n]; delete state.fuzzy[n]; }
    save();
  }

  // ---------------- 统计 ----------------
  function updateStats() {
    var known = Object.keys(state.known).length;
    var fuzzy = Object.keys(state.fuzzy).length;
    document.getElementById('st-total').textContent = DATA.length;
    document.getElementById('st-known').textContent = known;
    document.getElementById('st-fuzzy').textContent = fuzzy;
    var rate = DATA.length ? Math.round(known / DATA.length * 100) : 0;
    document.getElementById('st-rate').textContent = rate + '%';
    document.getElementById('progress-fill').style.width = rate + '%';
    document.getElementById('hero-count').textContent = DATA.length;
  }

  // ---------------- 筛选 ----------------
  function matchQuery(r, q) {
    if (!q) return true;
    return (r.w + ' ' + r.p + ' ' + r.m).toLowerCase().indexOf(q) >= 0;
  }
  function matchFreq(r) {
    if (state.freq === 'all') return true;
    if (state.freq === 'hi') return r.f >= 20;
    if (state.freq === 'mid') return r.f >= 8 && r.f <= 19;
    return r.f <= 7;
  }
  function matchStatus(r) {
    if (state.status === 'all') return true;
    var m = markOf(r.n);
    if (state.status === 'known') return m === 1;
    if (state.status === 'fuzzy') return m === 2;
    return m === 0;
  }
  function filtered() {
    var q = state.query.trim().toLowerCase();
    return DATA.filter(function (r) {
      return matchQuery(r, q) && matchFreq(r) && matchStatus(r);
    });
  }

  // ---------------- 速查表 ----------------
  function renderList() {
    var list = filtered();
    if (!list.length) {
      stage.innerHTML = '<div class="empty">没有匹配的成语，换个关键词或放宽筛选条件。</div>';
      return;
    }
    var q = state.query.trim();
    var html = '<div class="stage-meta">共 <span class="pos">' + list.length + '</span> 条' +
      (q ? '　匹配「' + esc(q) + '」' : '') + '</div>';

    if (q || state.freq !== 'all' || state.status !== 'all') {
      // 过滤态：直接平铺
      html += '<div class="idiom-grid">' + list.map(function (r) {
        return idiomCard(r, q);
      }).join('') + '</div>';
    } else {
      // 默认态：按拼音首字母分组折叠
      var groups = {};
      var order = [];
      list.forEach(function (r) {
        if (!groups[r.i]) { groups[r.i] = []; order.push(r.i); }
        groups[r.i].push(r);
      });
      order.sort(function (a, b) { return LETTERS.indexOf(a) - LETTERS.indexOf(b); });
      html += order.map(function (L) {
        var open = state.openGroups[L] ? ' open' : '';
        var rows = groups[L];
        return '<div class="group' + open + '">' +
          '<button class="group-head">' +
            '<span class="letter">' + esc(L) + '</span>' +
            '<span class="cnt">' + rows.length + ' 个成语</span>' +
            '<span class="arrow">▼</span>' +
          '</button>' +
          '<div class="group-body"><div class="idiom-grid">' +
            rows.map(function (r) { return idiomCard(r, ''); }).join('') +
          '</div></div>' +
        '</div>';
      }).join('');
    }
    stage.innerHTML = html;
    bindList();
  }

  function idiomCard(r, q) {
    var m = r.m.length > 78 ? r.m.slice(0, 78) + '…' : r.m;
    return '<div class="idiom">' +
      '<div class="w">' + hl(r.w, q) + '<span class="freq ' + freqClass(r.f) + '">考频' + r.f + '</span></div>' +
      '<div class="p">' + hl(r.p, q) + '</div>' +
      '<div class="m' + (q ? '' : ' clamped') + '">' + hl(m, q) + '</div>' +
    '</div>';
  }

  function hl(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    var needle = esc(q);
    var i = safe.toLowerCase().indexOf(needle.toLowerCase());
    if (i < 0) return safe;
    return safe.slice(0, i) + '<mark class="mark">' + safe.substr(i, needle.length) + '</mark>' + safe.slice(i + needle.length);
  }

  function bindList() {
    var heads = stage.querySelectorAll('.group-head');
    for (var i = 0; i < heads.length; i++) {
      heads[i].addEventListener('click', function () {
        var g = this.parentNode;
        var L = this.querySelector('.letter').textContent;
        g.classList.toggle('open');
        state.openGroups[L] = g.classList.contains('open');
      });
    }
  }

  // ---------------- 背诵卡 ----------------
  function flashQueue() {
    var q = state.query.trim().toLowerCase();
    var list = DATA.filter(function (r) {
      return matchQuery(r, q) && matchFreq(r) && matchStatus(r);
    });
    list.sort(function (a, b) { return b.f - a.f; });   // 高频优先
    return list;
  }

  function renderFlash() {
    var list = flashQueue();
    if (!list.length) {
      stage.innerHTML = '<div class="empty">当前筛选下没有可背的成语，换个条件试试。</div>';
      return;
    }
    if (state.idx >= list.length) state.idx = 0;
    var r = list[state.idx];
    var m = markOf(r.n);

    var body = state.flashUp
      ? '<div class="fw">' + esc(r.w) + '</div>' +
        '<div class="fp">' + esc(r.p) + '</div>' +
        '<span class="freq ' + freqClass(r.f) + '">考频' + r.f + ' 次</span>' +
        '<div class="hintline">按 空格 看释义 · 1 认识 · 2 模糊 · 3 不认识</div>'
      : '<div class="fm">' + esc(r.m) + '</div>' +
        '<div class="fw" style="font-size:26px">' + esc(r.w) + '</div>' +
        '<div class="fp">' + esc(r.p) + '</div>' +
        '<span class="freq ' + freqClass(r.f) + '">考频' + r.f + ' 次</span>';

    stage.innerHTML =
      '<div class="stage-meta">' +
        '<span class="pos">第 ' + (state.idx + 1) + ' / ' + list.length + ' 条</span>' +
        '<span>·</span><span>原编号 ' + r.n + '</span>' +
        (m === 1 ? '<span class="freq hi" style="margin:0">已掌握</span>' :
         m === 2 ? '<span class="freq mid" style="margin:0">模糊</span>' : '') +
      '</div>' +
      '<div class="flash-wrap"><div class="flash" id="flash">' + body + '</div></div>' +
      '<div class="flash-actions">' +
        '<button class="btn" id="f-prev">← 上一条</button>' +
        '<button class="btn primary" id="f-flip">看' + (state.flashUp ? '释义' : '成语') + '</button>' +
        '<button class="btn" id="f-next">下一条 →</button>' +
        '<button class="btn good" id="f-known">1 认识</button>' +
        '<button class="btn warn" id="f-fuzzy">2 模糊</button>' +
        '<button class="btn bad" id="f-unknown">3 不认识</button>' +
      '</div>' +
      '<div class="hint">空格 / 回车 翻面 · ← → 切换 · 1 / 2 / 3 标记掌握度</div>';

    bindFlash(list);
  }

  function bindFlash(list) {
    function step(d) {
      state.idx = (state.idx + d + list.length) % list.length;
      state.flashUp = true;
      renderFlash();
    }
    function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
    on('f-prev', function () { step(-1); });
    on('f-next', function () { step(1); });
    on('f-flip', function () { state.flashUp = !state.flashUp; renderFlash(); });
    on('f-known', function () { setMark(list[state.idx].n, 1); state.flashUp = false; renderFlash(); });
    on('f-fuzzy', function () { setMark(list[state.idx].n, 2); state.flashUp = false; renderFlash(); });
    on('f-unknown', function () { setMark(list[state.idx].n, 0); state.flashUp = false; renderFlash(); });
  }

  // ---------------- 释义测验 ----------------
  function buildQuiz() {
    var pool = DATA.filter(function (r) { return matchFreq(r) && matchStatus(r); });
    if (pool.length < 4) pool = DATA.slice();
    var right = pool[Math.floor(Math.random() * pool.length)];
    // 干扰项优先取同考频段
    var band = pool.filter(function (r) {
      return r.n !== right.n && Math.abs(r.f - right.f) <= 4;
    });
    var others = band.length >= 3 ? band : pool.filter(function (r) { return r.n !== right.n; });
    var picked = [];
    var guard = 0;
    while (picked.length < 3 && guard++ < 500) {
      var c = others[Math.floor(Math.random() * others.length)];
      if (c && picked.every(function (x) { return x.n !== c.n; })) picked.push(c);
    }
    var opts = picked.concat([right]).sort(function () { return Math.random() - 0.5; });
    return { right: right, opts: opts, answered: false };
  }

  function renderQuiz() {
    if (!state.quiz) state.quiz = buildQuiz();
    var q = state.quiz;
    var optsHtml = q.opts.map(function (o) {
      var cls = 'opt';
      if (q.answered) {
        cls += ' disabled';
        if (o.n === q.right.n) cls += ' right';
      }
      return '<button class="' + cls + '" data-n="' + o.n + '">' +
        '<span class="k">' + 'ABCD'.charAt(q.opts.indexOf(o)) + '</span>' +
        '<span class="w">' + esc(o.w) + '</span>' +
      '</button>';
    }).join('');

    var fb = '';
    if (q.answered) {
      fb = '<div class="quiz-fb ' + (q.picked === q.right.n ? 'ok' : 'no') + '">' +
        (q.picked === q.right.n ? '✓ 答对了。' : '✗ 答错了，正确答案是 <b>' + esc(q.right.w) + '</b>。') +
        '<br>' + esc(q.right.m) +
      '</div>';
    }

    stage.innerHTML =
      '<div class="quiz">' +
        '<div class="quiz-q">' +
          '<span class="tag">根据释义选出正确的成语</span>' +
          '<div class="stem">' + esc(q.right.m) + '</div>' +
          '<div class="opts">' + optsHtml + '</div>' +
          fb +
        '</div>' +
        '<div class="flash-actions">' +
          '<button class="btn primary" id="q-next">下一题</button>' +
          '<button class="btn" id="q-skip">跳过</button>' +
        '</div>' +
        '<div class="hint">答对自动记为「已掌握」；也可按 1 / 2 / 3 标记 · 空格下一题</div>' +
      '</div>';

    var btns = stage.querySelectorAll('.opt');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        if (q.answered) return;
        q.picked = Number(this.getAttribute('data-n'));
        q.answered = true;
        if (q.picked === q.right.n) { setMark(q.right.n, 1); }
        else { setMark(q.right.n, 2); }
        renderQuiz();
      });
    }
    var nb = document.getElementById('q-next');
    if (nb) nb.addEventListener('click', function () { state.quiz = buildQuiz(); renderQuiz(); });
    var sk = document.getElementById('q-skip');
    if (sk) sk.addEventListener('click', function () { state.quiz = buildQuiz(); renderQuiz(); });
  }

  // ---------------- 渲染入口 ----------------
  function render() {
    updateStats();
    if (state.mode === 'flash') renderFlash();
    else if (state.mode === 'quiz') renderQuiz();
    else renderList();
  }

  function setMode(m) {
    state.mode = m;
    state.idx = 0;
    state.quiz = null;
    state.flashUp = true;
    var tabs = document.querySelectorAll('#mode-tabs .tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-mode') === m);
    }
  }

  // ---------------- 事件 ----------------
  function initTheme() {
    var btn = document.getElementById('theme-toggle');
    function apply(t) {
      if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); btn.textContent = '☀️'; }
      else { document.documentElement.removeAttribute('data-theme'); btn.textContent = '🌙'; }
    }
    apply(THEME_STORE.get('light') || 'light');
    btn.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(cur);
      THEME_STORE.set(cur);
    });
  }

  function initControls() {
    var search = document.getElementById('search');
    search.addEventListener('input', AppUtils.debounce(function () {
      state.query = search.value;
      state.idx = 0;
      render();
    }, 140));

    document.getElementById('filter-freq').addEventListener('change', function () {
      state.freq = this.value; state.idx = 0; state.quiz = null; render();
    });
    document.getElementById('filter-status').addEventListener('change', function () {
      state.status = this.value; state.idx = 0; state.quiz = null; render();
    });
    document.getElementById('mode-tabs').addEventListener('click', function (ev) {
      var t = ev.target.closest('.tab');
      if (!t) return;
      setMode(t.getAttribute('data-mode'));
      render();
    });
    document.getElementById('btn-random').addEventListener('click', function () {
      var pool = filtered();
      if (!pool.length) { alert('当前筛选下没有条目'); return; }
      setMode('flash');
      state.flashUp = true;
      var r = pool[Math.floor(Math.random() * pool.length)];
      var q = flashQueue();
      state.idx = Math.max(0, q.findIndex(function (x) { return x.n === r.n; }));
      render();
    });
    document.getElementById('btn-reset').addEventListener('click', function () {
      if (!confirm('确定清空全部 ' + DATA.length + ' 个成语的掌握度标记？')) return;
      state.known = {}; state.fuzzy = {};
      save(); render();
    });
  }

  function initKeyboard() {
    document.addEventListener('keydown', function (ev) {
      var tag = (ev.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') {
        if (ev.key === 'Escape') ev.target.blur();
        return;
      }
      if (ev.key === '/') { ev.preventDefault(); document.getElementById('search').focus(); return; }
      if (state.mode === 'flash') {
        var list = flashQueue();
        if (!list.length) return;
        var r = list[state.idx];
        if (ev.key === ' ') { ev.preventDefault(); state.flashUp = !state.flashUp; renderFlash(); }
        else if (ev.key === 'ArrowLeft') { ev.preventDefault(); state.idx = (state.idx - 1 + list.length) % list.length; state.flashUp = true; renderFlash(); }
        else if (ev.key === 'ArrowRight') { ev.preventDefault(); state.idx = (state.idx + 1) % list.length; state.flashUp = true; renderFlash(); }
        else if (ev.key === '1') { setMark(r.n, 1); state.flashUp = false; renderFlash(); }
        else if (ev.key === '2') { setMark(r.n, 2); state.flashUp = false; renderFlash(); }
        else if (ev.key === '3') { setMark(r.n, 0); state.flashUp = false; renderFlash(); }
      } else if (state.mode === 'quiz') {
        var q = state.quiz;
        if (ev.key === ' ') { ev.preventDefault(); state.quiz = buildQuiz(); renderQuiz(); }
        else if (q && !q.answered && '1234'.indexOf(ev.key) >= 0) {
          var o = q.opts[Number(ev.key) - 1];
          if (o) {
            q.picked = o.n; q.answered = true;
            if (q.picked === q.right.n) setMark(q.right.n, 1); else setMark(q.right.n, 2);
            renderQuiz();
          }
        }
      }
    });
  }

  // ---------------- 启动 ----------------
  load();
  initTheme();
  initControls();
  initKeyboard();
  render();
})();
</script>
